<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <title>CineTrack</title>
</head>

<body class="flex flex-col bg-black gap-6">
    <header class="flex border-b border-gray-700">
        <div class="flex w-1/3 items-center">
            <a href="./index.html"><img class="w-40" src="./img/logo.png" alt="logo"></a>
        </div>
        <div class="w-full flex items-center justify-center gap-6">
            <p class="text-gray-400"><a href="index.html">HOME</a></p>
            <p class="text-gray-400"><a href="admin.html">ADMIN</a></p>
        </div>
    </header>
    <main class="">
        <section class="flex justify-around items-center">
            <div>
                <p class="text-sm font-semibold text-gray-400">Content Management</p>
                <h2 class="text-3xl font-bold mt-2 text-white">All Content</h2>
            </div>
            <button id="addBtn" class="p-4 bg-red-500 text-white rounded-2xl">Add Content</button>
        </section>
        <section class="flex gap-4 p-4 m-4 border-white bg-[#18181B] rounded-2xl">
        <div class="flex w-2/3">
            <input id="search_admin" type="text" class="bg-[#2b2b34] h-10 w-full rounded-sm text-center text-white"
                placeholder="Search movies or series...">
        </div>
        <div class="flex w-1/3">
            <select id="filter_admin" class="w-full bg-[#2b2b34] rounded-sm text-center text-white" name="filter" id="">
                <option value="">-- Select your choise</option>
                <option value="Tout">Tout</option>
                <option value="Movies">Movies</option>
                <option value="Series">Series</option>
            </select>
        </div>
        </section>
        <section id="list" class="w-full justify-center">
            <div class="w-full h-full">
                <table class="w-full">
                    <thead class="bg-[#18181B]">
                        <tr>
                            <td class="p-4 font-bold text-white">Title</td>
                            <td class="p-4 font-bold text-white">Type</td>
                            <td class="p-4 font-bold text-white">Rating</td>
                            <td class="p-4 font-bold text-white">Actions</td>
                        </tr>
                    </thead>
                    <tbody id="movies" class="bg-gray-900">
                    </tbody>
                </table>
            </div>
        </section>
        <section id="modal_admin">
            <div id="modal-content" class="items-center fixed hidden inset-0 justify-center backdrop-blur-sm z-50">
                <div id="content" class="relative w-[700px] max-w-[90%] min-h-[400px] bg-[#181818] text-white shadow-2xl rounded-lg p-6"></div>
            </div>
        </section>
    </main>
    <script type="module" src="./js/admin.js"></script>
</body>

</html>
